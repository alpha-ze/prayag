version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: promptx
      POSTGRES_USER: promptx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - promptx-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://promptx:${POSTGRES_PASSWORD}@postgres:5432/promptx
      JWT_SECRET: ${JWT_SECRET}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      IMAGE_GENERATION_API_KEY: ${IMAGE_GENERATION_API_KEY}
      NODE_ENV: production
      PORT: 3001
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - promptx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ${FRONTEND_API_URL}
      VITE_WS_URL: ${FRONTEND_WS_URL}
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - promptx-network

  # Optional: Redis for caching and sessions
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - promptx-network

  # Optional: Nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - promptx-network

volumes:
  postgres_data:

networks:
  promptx-network:
    driver: bridge